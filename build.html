<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC Parts Store</title>
  <link rel="icon" href="./img/pc-part-store.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="build-page">

  <div w3-include-html="components/navbar.html"></div>

  <section class="container-fluid p-0">
    <div class="page-header">
      <h2>Choose Your Parts</h2>
      <p class="section-intro">Pick compatible components and build your dream PC step by step.</p>
    </div>
  </section>

  <div class="build-layout">
    <!-- Part picker -->
    <section class="build-picker">
      <div class="build-picker-head">
        <span class="section-label">Build list</span>
        <h3>Select Components</h3>
        <p>Click each row to choose a part for your build.</p>
      </div>
      <div class="container-b">
        <form id="pc-builder-form" class="part-list">
          <div class="part-row">
            <div class="part-row-icon"><i class="fas fa-microchip"></i></div>
            <div class="part-row-body">
              <label for="cpu">CPU</label>
              <button class="btn-warning part-choose-btn" type="button" id="choose-cpu"><i class="fas fa-plus"></i> Choose a CPU</button>
              <select id="cpu" name="cpu" class="hidden part-select">
                <option value="intel-i5">Intel i5</option>
                <option value="intel-i7">Intel i7</option>
                <option value="amd-ryzen-5">AMD Ryzen 5</option>
                <option value="amd-ryzen-7">AMD Ryzen 7</option>
              </select>
            </div>
          </div>
          <div class="part-row">
            <div class="part-row-icon"><i class="fas fa-fan"></i></div>
            <div class="part-row-body">
              <label for="cpu-cooler">CPU Cooler</label>
              <button class="btn-warning part-choose-btn" type="button" id="choose-cpu-cooler"><i class="fas fa-plus"></i> Choose a CPU Cooler</button>
              <select id="cpu-cooler" name="cpu-cooler" class="hidden part-select">
                <option value="cooler-master">Cooler Master</option>
                <option value="noctua">Noctua</option>
                <option value="corsair">Corsair</option>
              </select>
            </div>
          </div>
          <div class="part-row">
            <div class="part-row-icon"><i class="fas fa-server"></i></div>
            <div class="part-row-body">
              <label for="motherboard">Motherboard</label>
              <button class="btn-warning part-choose-btn" type="button" id="choose-motherboard"><i class="fas fa-plus"></i> Choose a Motherboard</button>
              <select id="motherboard" name="motherboard" class="hidden part-select">
                <option value="asus-rog">ASUS ROG</option>
                <option value="msi-tomahawk">MSI Tomahawk</option>
                <option value="gigabyte-aorus">Gigabyte AORUS</option>
              </select>
            </div>
          </div>
          <div class="part-row">
            <div class="part-row-icon"><i class="fas fa-memory"></i></div>
            <div class="part-row-body">
              <label for="memory">Memory</label>
              <button class="btn-warning part-choose-btn" type="button" id="choose-memory"><i class="fas fa-plus"></i> Choose Memory</button>
              <select id="memory" name="memory" class="hidden part-select">
                <option value="corsair-16gb">Corsair 16GB</option>
                <option value="gskill-16gb">G.Skill 16GB</option>
                <option value="kingston-32gb">Kingston 32GB</option>
              </select>
            </div>
          </div>
          <div class="part-row">
            <div class="part-row-icon"><i class="fas fa-hdd"></i></div>
            <div class="part-row-body">
              <label for="storage">Storage</label>
              <button class="btn-warning part-choose-btn" type="button" id="choose-storage"><i class="fas fa-plus"></i> Choose Storage</button>
              <select id="storage" name="storage" class="hidden part-select">
                <option value="samsung-1tb">Samsung 1TB SSD</option>
                <option value="wd-1tb">Western Digital 1TB HDD</option>
                <option value="seagate-2tb">Seagate 2TB HDD</option>
              </select>
            </div>
          </div>
          <div class="part-row">
            <div class="part-row-icon"><i class="fas fa-tv"></i></div>
            <div class="part-row-body">
              <label for="video-card">Video Card</label>
              <button class="btn-warning part-choose-btn" type="button" id="choose-video-card"><i class="fas fa-plus"></i> Choose a Video Card</button>
              <select id="video-card" name="video-card" class="hidden part-select">
                <option value="nvidia-rtx-3060">NVIDIA RTX 3060</option>
                <option value="nvidia-rtx-3080">NVIDIA RTX 3080</option>
                <option value="amd-rx-6700xt">AMD RX 6700 XT</option>
              </select>
            </div>
          </div>
          <div class="part-row">
            <div class="part-row-icon"><i class="fas fa-box"></i></div>
            <div class="part-row-body">
              <label for="case">Case</label>
              <button class="btn-warning part-choose-btn" type="button" id="choose-case"><i class="fas fa-plus"></i> Choose a Case</button>
              <select id="case" name="case" class="hidden part-select">
                <option value="nzxt-h510">NZXT H510</option>
                <option value="corsair-4000d">Corsair 4000D</option>
                <option value="fractal-meshify-c">Fractal Meshify C</option>
              </select>
            </div>
          </div>
          <div class="part-row">
            <div class="part-row-icon"><i class="fas fa-bolt"></i></div>
            <div class="part-row-body">
              <label for="power-supply">Power Supply</label>
              <button class="btn-warning part-choose-btn" type="button" id="choose-power-supply"><i class="fas fa-plus"></i> Choose a Power Supply</button>
              <select id="power-supply" name="power-supply" class="hidden part-select">
                <option value="corsair-650w">Corsair 650W</option>
                <option value="evga-750w">EVGA 750W</option>
                <option value="seasonic-850w">Seasonic 850W</option>
              </select>
            </div>
          </div>
        </form>
      </div>
    </section>

    <!-- Overview / CRUD -->
    <section class="build-overview">
      <div class="page-header build-overview-header">
        <h2>Overview</h2>
        <p class="section-intro">Manage components in your build list.</p>
      </div>
      <div class="table-container build-table-wrap">
        <h2 class="build-table-title"><i class="fas fa-list-alt"></i> List Components</h2>
        <form class="build-crud-form">
          <div class="build-form-grid">
            <div class="build-field">
              <label for="id">ID</label>
              <input id="id" class="form-control" placeholder="ID" />
            </div>
            <div class="build-field">
              <label for="compo">Component</label>
              <input id="compo" class="form-control" placeholder="e.g. CPU" />
            </div>
            <div class="build-field">
              <label for="selcet_compo">Selection</label>
              <input id="selcet_compo" class="form-control" placeholder="Selected part" />
            </div>
            <div class="build-field">
              <label for="shipping">Shipping</label>
              <input id="shipping" class="form-control" placeholder="e.g. Free" />
            </div>
            <div class="build-field">
              <label for="price">Price</label>
              <input id="price" class="form-control" placeholder="0.00" />
            </div>
          </div>
        </form>
        <div class="build-table-scroll">
          <table id="table-photo"></table>
        </div>
      </div>
    </section>
  </div>

  <div w3-include-html="components/footer.html"></div>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <script src="js/script.js"></script>
  <script>includeHTML();</script>
</body>
</html>
